<html><head><title>帆云主机 · 新建服务器</title></head><body>
<h1>新建服务器</h1>
<form>
<label>邮箱 <input id="email" type="email"></label>
<label>机房 <select id="region"><option>东京</option><option>新加坡</option><option disabled>香港（缺货）</option></select></label>
<label>系统 <select id="os"><option>Debian 12</option><option>Ubuntu 24.04</option></select></label>
<label>套餐 <select id="plan"><option>1核 1GB · $5.00/月</option></select></label>
<label>数量 <input id="qty" type="number" value="1"></label>
<label>SSH 公钥 <textarea id="ssh-key"></textarea></label>
<button type="button" data-goto="fancloud-checkout.html" id="next">下一步：确认订单</button>
</form>
</body></html>
